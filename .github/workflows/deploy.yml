# Builds the site and uploads it to your own hosting (cPanel) by FTP
# every time something is pushed to main — including articles published from /admin.
#
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions
#   Secrets:   FTP_SERVER  (e.g. ftp.americancarsaga.com)
#              FTP_USERNAME
#              FTP_PASSWORD
#   Variables: SITE_URL        (e.g. https://www.americancarsaga.com)
#              FTP_SERVER_DIR  (optional, default: public_html/)
name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
